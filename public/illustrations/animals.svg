    <path d="M340,42 l0.8,2.4 l2.4,0.8 l-2.4,0.8 l-0.8,2.4 l-0.8,-2.4 l-2.4,-0.8 l2.4,-0.8 Z"/>
    <path d="M155,30 l0.7,2 l2,0.7 l-2,0.7 l-0.7,2 l-0.7,-2 l-2,-0.7 l2,-0.7 Z"/>
