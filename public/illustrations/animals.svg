  <!-- SKY -->
  <rect x="0" y="0" width="400" height="180" fill="url(#animal-sky)"/>
  <circle cx="270" cy="58" r="60" fill="url(#animal-sun)"/>
  <circle cx="270" cy="58" r="20" fill="#fffef0" opacity="0.9"/>

  <!-- distant tree line / forest -->
  <g opacity="0.55">
    <ellipse cx="40" cy="120" rx="46" ry="40" fill="#a5b4fc"/>
    <ellipse cx="95" cy="116" rx="52" ry="46" fill="#93c5fd"/>
    <ellipse cx="160" cy="122" rx="44" ry="38" fill="#a5b4fc"/>
    <ellipse cx="300" cy="120" rx="50" ry="42" fill="#93c5fd"/>
    <ellipse cx="360" cy="118" rx="48" ry="44" fill="#a5b4fc"/>
  </g>
  <g opacity="0.4">
    <ellipse cx="200" cy="128" rx="60" ry="40" fill="#bfdbfe"/>
    <ellipse cx="245" cy="124" rx="40" ry="34" fill="#c7d2fe"/>
  </g>

  <!-- god rays -->
  <g opacity="0.5">
    <polygon points="255,10 285,10 235,150 175,150" fill="url(#animal-ray)"/>
    <polygon points="290,8 312,8 330,150 286,150" fill="url(#animal-ray)"/>
    <polygon points="225,12 240,12 205,150 165,150" fill="url(#animal-ray)" opacity="0.7"/>
  </g>

  <!-- soft mist over forest -->
  <ellipse cx="120" cy="150" rx="120" ry="26" fill="url(#animal-mist)" opacity="0.7" filter="url(#animal-blur)"/>
  <ellipse cx="320" cy="152" rx="100" ry="22" fill="url(#animal-mist)" opacity="0.6" filter="url(#animal-blur)"/>

  <!-- MIDGROUND trees -->
  <g>
    <rect x="42" y="92" width="9" height="58" rx="4" fill="url(#animal-trunk)"/>
    <ellipse cx="47" cy="78" rx="34" ry="32" fill="url(#animal-tree)"/>
    <ellipse cx="38" cy="72" rx="20" ry="18" fill="url(#animal-tree2)" opacity="0.8"/>
    <ellipse cx="40" cy="66" rx="11" ry="9" fill="#dcfce7" opacity="0.6"/>
  </g>
  <g>
    <rect x="346" y="96" width="10" height="56" rx="4" fill="url(#animal-trunk)"/>
    <ellipse cx="351" cy="80" rx="38" ry="35" fill="url(#animal-tree)"/>
    <ellipse cx="360" cy="74" rx="22" ry="19" fill="url(#animal-tree2)" opacity="0.8"/>
    <ellipse cx="355" cy="68" rx="12" ry="9" fill="#dcfce7" opacity="0.6"/>
  </g>
  <g>
    <rect x="170" y="104" width="7" height="46" rx="3" fill="url(#animal-trunk)"/>
    <ellipse cx="173" cy="94" rx="24" ry="23" fill="url(#animal-tree2)"/>
    <ellipse cx="168" cy="88" rx="13" ry="11" fill="#dcfce7" opacity="0.55"/>
  </g>

  <!-- GROUND -->
  <path d="M0,150 Q120,134 220,144 T400,142 L400,260 L0,260 Z" fill="url(#animal-ground)"/>
  <path d="M0,178 Q140,164 260,176 T400,172 L400,260 L0,260 Z" fill="url(#animal-ground2)" opacity="0.85"/>

  <!-- POND with reflection -->
  <ellipse cx="118" cy="206" rx="92" ry="34" fill="url(#animal-pond)"/>
  <ellipse cx="118" cy="206" rx="92" ry="34" fill="#ffffff" opacity="0.12"/>
  <ellipse cx="100" cy="198" rx="40" ry="9" fill="#ffffff" opacity="0.3"/>
  <ellipse cx="140" cy="214" rx="30" ry="6" fill="#ffffff" opacity="0.2"/>
  <path d="M55,200 q15,-5 30,0 M150,210 q14,-4 28,0 M95,218 q12,-3 24,0" stroke="#ffffff" stroke-width="1.3" fill="none" opacity="0.5"/>
  <!-- lily pads -->
  <ellipse cx="70" cy="214" rx="13" ry="5" fill="#22c55e"/>
  <ellipse cx="70" cy="213" rx="13" ry="5" fill="#4ade80" opacity="0.6"/>
  <ellipse cx="165" cy="200" rx="11" ry="4.5" fill="#16a34a"/>
  <circle cx="166" cy="198" r="3" fill="#fbcfe8"/>
  <circle cx="163" cy="200" r="2.4" fill="#f9a8d4"/>

  <!-- reflections (blurred) -->
  <g filter="url(#animal-blur-soft)" opacity="0.35">
    <ellipse cx="118" cy="222" rx="13" ry="9" fill="#fbbf24"/>
    <ellipse cx="152" cy="220" rx="11" ry="8" fill="#fb923c"/>
