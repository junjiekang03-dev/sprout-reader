    <circle cx="3" cy="-11" r="1.7" fill="#3f2a14"/>
    <ellipse cx="0" cy="-7" rx="1.6" ry="1.2" fill="#f472b6"/>
    <circle cx="-7" cy="-7" r="2" fill="#fbcfe8" opacity="0.8"/>
