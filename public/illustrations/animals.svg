    <ellipse cx="0" cy="22" rx="17" ry="5" fill="#16a34a" opacity="0.3"/>
    <ellipse cx="0" cy="6" rx="14" ry="14" fill="url(#animal-cat)"/>
    <path d="M16,12 q14,-2 12,-16 q-6,2 -8,8" fill="url(#animal-cat)"/>
    <circle cx="0" cy="-10" r="11" fill="url(#animal-cat)"/>
    <path d="M-10,-18 l-3,-9 l9,4 Z" fill="#fb923c"/>
    <path d="M10,-18 l3,-9 l-9,4 Z" fill="#fb923c"/>
    <path d="M-9,-19 l-1.5,-5 l5,2 Z" fill="#fbcfe8"/>
    <path d="M9,-19 l1.5,-5 l-5,2 Z" fill="#fbcfe8"/>
    <ellipse cx="-4" cy="-11" rx="1.8" ry="2.4" fill="#3f2a14"/>
    <ellipse cx="4" cy="-11" rx="1.8" ry="2.4" fill="#3f2a14"/>
    <path d="M0,-7 l-2,2 h4 Z" fill="#f472b6"/>
    <path d="M0,-5 q-2,2 -5,1 M0,-5 q2,2 5,1" stroke="#92400e" stroke-width="0.8" fill="none"/>
    <circle cx="-8" cy="-6" r="2.4" fill="#fbcfe8" opacity="0.7"/>
    <circle cx="8" cy="-6" r="2.4" fill="#fbcfe8" opacity="0.7"/>
