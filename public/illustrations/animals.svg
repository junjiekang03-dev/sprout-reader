    <path d="M2,1 q-7,5 -11,4 q5,-3 9,-6 Z" fill="#60a5fa"/>
  </g>

  <!-- BUTTERFLIES -->
  <g transform="translate(95,120)">
    <path d="M0,0 q-9,-9 -13,-3 q-1,7 11,5 Z" fill="#f472b6"/>
    <path d="M0,0 q9,-9 13,-3 q1,7 -11,5 Z" fill="#fbcfe8"/>
    <path d="M0,0 q-7,7 -10,4 q0,-6 9,-3 Z" fill="#fb923c" opacity="0.9"/>
