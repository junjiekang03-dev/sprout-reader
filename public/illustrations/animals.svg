  <g transform="translate(228,196)">
    <ellipse cx="0" cy="26" rx="22" ry="6" fill="#16a34a" opacity="0.3"/>
    <ellipse cx="0" cy="8" rx="19" ry="17" fill="#ffffff"/>
    <ellipse cx="0" cy="10" rx="13" ry="11" fill="#f1f5f9"/>
    <ellipse cx="-18" cy="2" rx="7" ry="9" fill="#334155"/>
