  <!-- soft glows behind characters -->
  <circle cx="112" cy="190" r="30" fill="url(#animal-glow)" opacity="0.4"/>
  <circle cx="228" cy="184" r="34" fill="url(#animal-glow)" opacity="0.35"/>

  <!-- FIREFLIES & POLLEN particles (varied size/opacity) -->
  <g>
    <circle cx="60" cy="95" r="3" fill="#fef9c3" opacity="0.9" filter="url(#animal-blur-soft)"/>
    <circle cx="60" cy="95" r="1.3" fill="#fffef0"/>
    <circle cx="135" cy="105" r="2.4" fill="#fde68a" opacity="0.85" filter="url(#animal-blur-soft)"/>
    <circle cx="135" cy="105" r="1" fill="#fffef0"/>
    <circle cx="240" cy="60" r="2.6" fill="#fef9c3" opacity="0.9" filter="url(#animal-blur-soft)"/>
    <circle cx="240" cy="60" r="1.1" fill="#fff"/>
    <circle cx="320" cy="70" r="3.2" fill="#fde68a" opacity="0.8" filter="url(#animal-blur-soft)"/>
    <circle cx="320" cy="70" r="1.3" fill="#fffef0"/>
    <circle cx="170" cy="130" r="2" fill="#fef9c3" opacity="0.85" filter="url(#animal-blur-soft)"/>
    <circle cx="200" cy="100" r="1.6" fill="#fffef0" opacity="0.9"/>
    <circle cx="285" cy="95" r="2.2" fill="#fef9c3" opacity="0.8" filter="url(#animal-blur-soft)"/>
    <circle cx="285" cy="95" r="0.9" fill="#fff"/>
    <circle cx="90" cy="60" r="1.5" fill="#fffef0" opacity="0.85"/>
    <circle cx="40" cy="140" r="2" fill="#fde68a" opacity="0.75" filter="url(#animal-blur-soft)"/>
    <circle cx="260" cy="130" r="1.8" fill="#fef9c3" opacity="0.8"/>
    <circle cx="350" cy="110" r="2.4" fill="#fde68a" opacity="0.8" filter="url(#animal-blur-soft)"/>
    <circle cx="350" cy="110" r="1" fill="#fff"/>
    <circle cx="120" cy="45" r="1.2" fill="#fffef0" opacity="0.8"/>
    <circle cx="215" cy="135" r="1.4" fill="#fef9c3" opacity="0.8"/>
    <circle cx="75" cy="115" r="1.3" fill="#fffef0" opacity="0.75"/>
    <circle cx="305" cy="50" r="1.6" fill="#fef9c3" opacity="0.8"/>
    <circle cx="185" cy="75" r="1.1" fill="#fffef0" opacity="0.7"/>
