    <ellipse cx="-5" cy="-3" rx="6" ry="2" fill="#bfdbfe" opacity="0.8"/>
    <ellipse cx="5" cy="-3" rx="6" ry="2" fill="#bfdbfe" opacity="0.8"/>
    <ellipse cx="-5" cy="1" rx="5" ry="1.7" fill="#a5b4fc" opacity="0.7"/>
    <ellipse cx="5" cy="1" rx="5" ry="1.7" fill="#a5b4fc" opacity="0.7"/>
    <circle cx="0" cy="-7" r="1.8" fill="#0284c7"/>
