    <ellipse cx="-6" cy="-12" rx="4.5" ry="6" fill="#334155"/>
    <ellipse cx="6" cy="-12" rx="4.5" ry="6" fill="#334155"/>
    <circle cx="-5" cy="-13" r="2" fill="#fff"/>
    <circle cx="7" cy="-13" r="2" fill="#fff"/>
    <ellipse cx="0" cy="-6" rx="2.6" ry="2" fill="#334155"/>
    <path d="M-3,-3 Q0,0 3,-3" stroke="#334155" stroke-width="1.2" fill="none"/>
    <circle cx="-10" cy="-7" r="2.6" fill="#fbcfe8" opacity="0.7"/>
    <circle cx="10" cy="-7" r="2.6" fill="#fbcfe8" opacity="0.7"/>
  </g>

  <!-- RABBIT (foreground left of grass) -->
  <g transform="translate(58,200)">
    <ellipse cx="0" cy="20" rx="15" ry="5" fill="#16a34a" opacity="0.3"/>
    <ellipse cx="0" cy="6" rx="12" ry="13" fill="#f8f9ff"/>
    <ellipse cx="0" cy="12" rx="8" ry="8" fill="#fbcfe8" opacity="0.5"/>
    <circle cx="-1" cy="-10" r="9" fill="#f8f9ff"/>
    <ellipse cx="-6" cy="-24" rx="3.5" ry="11" fill="#f8f9ff"/>
