    <path d="M380,236 q-4,-20 2,-32 M390,238 q-5,-18 -12,-26 M398,240 q3,-16 -4,-26" stroke="#15803d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="-1" cy="196" r="3" fill="#fbcfe8"/><circle cx="-1" cy="196" r="1.3" fill="#fef9c3"/>
    <circle cx="384" cy="202" r="3" fill="#fde68a"/><circle cx="384" cy="202" r="1.3" fill="#fff"/>
