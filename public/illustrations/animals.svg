    <path d="M14,200 q-3,-14 0,-26 M20,200 q1,-15 6,-24 M26,202 q4,-12 11,-20" stroke="#16a34a" stroke-width="2" fill="none"/>
    <circle cx="13" cy="172" r="4.5" fill="#f472b6"/><circle cx="13" cy="172" r="2" fill="#fef9c3"/>
    <circle cx="27" cy="180" r="4" fill="#fb923c"/><circle cx="27" cy="180" r="1.8" fill="#fef9c3"/>
    <circle cx="38" cy="184" r="4" fill="#a5b4fc"/><circle cx="38" cy="184" r="1.8" fill="#ffffff"/>
  </g>

  <!-- mushrooms -->
  <g>
    <rect x="222" y="186" width="7" height="13" rx="3" fill="#fff7ed"/>
    <path d="M213,188 q12,-16 24,0 Z" fill="url(#animal-mush)"/>
    <circle cx="221" cy="183" r="1.8" fill="#fff" opacity="0.9"/>
    <circle cx="229" cy="186" r="1.5" fill="#fff" opacity="0.9"/>
    <rect x="237" y="192" width="5" height="10" rx="2.5" fill="#fff7ed"/>
    <path d="M231,194 q8,-11 16,0 Z" fill="#fb923c"/>
    <circle cx="238" cy="191" r="1.2" fill="#fff" opacity="0.9"/>
