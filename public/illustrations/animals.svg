  <!-- DEER (background right) -->
  <g transform="translate(300,150)">
    <ellipse cx="0" cy="40" rx="18" ry="6" fill="#16a34a" opacity="0.3"/>
    <ellipse cx="0" cy="22" rx="15" ry="11" fill="url(#animal-deer)"/>
    <rect x="-13" y="26" width="5" height="14" rx="2.5" fill="#b45309"/>
    <rect x="8" y="26" width="5" height="14" rx="2.5" fill="#b45309"/>
