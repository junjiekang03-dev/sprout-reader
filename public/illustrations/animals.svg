    <path d="M11,4 q12,1 11,-10 q-5,2 -7,7" fill="#fde047"/>
    <circle cx="-10" cy="-8" r="9" fill="url(#animal-duck)"/>
    <path d="M-19,-8 q-7,0 -7,3 q0,2 7,1 Z" fill="#fb923c"/>
    <circle cx="-12" cy="-10" r="1.8" fill="#3f2a14"/>
    <circle cx="-11.4" cy="-10.6" r="0.7" fill="#fff"/>
    <circle cx="-5" cy="-3" r="2.3" fill="#fed7aa" opacity="0.7"/>
  </g>

  <!-- BLUE BIRDS flying -->
  <g transform="translate(150,70)">
    <ellipse cx="0" cy="0" rx="6" ry="4" fill="#60a5fa"/>
    <circle cx="6" cy="-2" r="3.4" fill="#93c5fd"/>
    <path d="M5,-3 l4,-1 l-2,3 Z" fill="#fb923c"/>
    <path d="M-2,-2 q-9,-6 -13,-2 q6,2 11,4 Z" fill="#3b82f6"/>
    <path d="M2,1 q-7,5 -11,4 q5,-3 9,-6 Z" fill="#60a5fa"/>
    <circle cx="7" cy="-3" r="0.9" fill="#1e3a5f"/>
